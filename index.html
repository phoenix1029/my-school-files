<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Project Download Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 20px;
            color: #333333;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #666666;
            margin-bottom: 25px;
        }
        .download-btn {
            display: inline-block;
            background-color: #2ea44f;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        .download-btn:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Social Media User Management System</h1>
        <p>Click below to download the password-protected project files archive.</p>
        <a href="project_files.zip" class="download-btn" download>📦 Download Project Files</a>
    </div>
</body>
</html>
